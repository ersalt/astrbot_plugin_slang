<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>黑话审核台 · lite</title>
<style>
:root{
  --bg:#eef0f4; --card:#fff; --bubble:#f4f5f8; --text:#1b1c1f; --muted:#85868c;
  --line:#e6e7eb; --accent:#0a6cff; --accent-soft:#e8f0ff;
  --ok:#0f8a44; --ok-soft:#e7f7ee; --danger:#c0392b; --danger-soft:#fff2f1;
  --warn:#b26a00; --warn-soft:#fff4e5;
}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);
  font:14px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased}
.app{display:flex;gap:14px;max-width:1200px;margin:0 auto;padding:18px;align-items:flex-start}
.card{background:var(--card);border-radius:16px;
  box-shadow:0 1px 2px rgba(20,20,40,.04),0 10px 28px rgba(20,20,40,.05)}

/* 左栏 */
.side{width:252px;flex:0 0 252px;padding:14px;position:sticky;top:18px}
.side h1{font-size:15px;font-weight:650;margin:2px 4px 14px}
.side h1 small{display:block;font-size:11px;color:var(--muted);font-weight:400;margin-top:2px}
.nav,.sub{width:100%}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:9px 12px;border-radius:12px;background:var(--bubble);margin-bottom:14px;
  cursor:pointer;font-weight:600;font-size:13.5px;transition:background .15s}
.nav:hover{background:#eceef3}
.nav.active{background:var(--accent-soft);color:#0a5ad4}
.nav .caret{font-size:10px;color:var(--muted);margin-right:2px;width:10px}
.nav .label-text{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav .count,.sub .count{display:inline-flex;align-items:center;justify-content:center;
  min-width:22px;height:22px;padding:0 6px;border-radius:999px;
  background:#e4e6ec;color:#4a4b51;font-size:11.5px;font-weight:700;line-height:1;
  flex:0 0 auto}
.nav.active .count{background:#d3e2ff;color:#0a5ad4}
.sub .count{min-width:18px;height:18px;font-size:11px;background:#e9eaef}
.subs{display:flex;flex-direction:column;gap:7px;margin:0 0 14px}
.sub{display:flex;align-items:center;justify-content:space-between;gap:6px;
  padding:5px 8px 5px 22px;border-radius:9px;font-size:12.5px;color:#5b5c62;
  cursor:pointer;transition:background .15s}
.sub:hover{background:#f4f5f8}
.sub.active{background:var(--accent-soft);color:#0a5ad4}
.sub .label{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.sub .gname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.sub .gid{font-size:11px;color:var(--muted);white-space:nowrap}
.side-foot{margin-top:8px}
.side-foot button{border:none;background:none;color:var(--muted);font-size:12px;cursor:pointer;padding:4px}
.side-foot button:hover{color:var(--accent)}

/* 右栏 */
.main{flex:1;min-width:0;padding:16px;min-height:calc(100vh - 36px)}
.main-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.main-head h2{font-size:16px;font-weight:650;flex:1;min-width:0;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.main-head h2 span{font-size:12px;color:var(--muted);font-weight:400;margin-left:6px}
.search{width:220px;flex:0 0 auto}

.entry{display:grid;grid-template-columns:minmax(64px,110px) 1fr 172px;
  gap:12px;align-items:center;background:var(--bubble);border-radius:14px;
  padding:12px 14px;margin-bottom:10px}
.entry .name{font-weight:650;font-size:14px;word-break:break-all}
.entry .content{min-width:0}
.meaning{color:#3a3b40;word-break:break-word}
.meta{font-size:11.5px;color:var(--muted);margin-top:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ops{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.btn{font:inherit;font-size:11.5px;padding:6px 2px;border-radius:9px;cursor:pointer;
  border:1px solid var(--line);background:#fff;color:#4a4b51;white-space:nowrap;
  transition:background .12s,border-color .12s}
.btn:hover{border-color:#d3d4da}
.btn.on{background:var(--ok-soft);border-color:#bfe8d0;color:var(--ok)}
.btn.off{background:var(--danger-soft);border-color:#f3cfcb;color:var(--danger)}
.btn:disabled{opacity:.4;cursor:default}
.btn.danger{background:var(--danger-soft);border-color:#f3cfcb;color:var(--danger)}
.btn.danger:hover{background:#ffe5e2}
.btn.danger.armed{background:var(--danger);border-color:var(--danger);color:#fff}
.empty{color:var(--muted);text-align:center;padding:64px 0}

input,select,textarea,button{font:inherit;color:var(--text);background:#fff;
  border:1px solid var(--line);border-radius:9px;padding:6px 10px}
input,textarea,select{width:100%}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
textarea{resize:vertical;min-height:96px;line-height:1.5}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{background:#0057d6}
button.link{border:none;background:none;color:var(--accent);padding:6px 10px;cursor:pointer}

.mask{position:fixed;inset:0;background:rgba(20,20,30,.28);display:none;
  align-items:center;justify-content:center;padding:20px;z-index:20}
.mask.on{display:flex}
.modal{width:min(520px,100%);padding:18px}
.modal h3{font-size:15px;margin-bottom:14px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:12px;color:var(--muted)}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.form-row{display:flex;gap:10px;flex-wrap:wrap}
.form-row .field{flex:1;min-width:140px}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
  background:#1b1c1f;color:#fff;padding:8px 16px;border-radius:9px;font-size:13px;
  opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
.toast.show{opacity:.94}

@media (max-width:820px){
  .app{flex-direction:column;padding:12px}
  .side{width:100%;flex:none;position:static}
  .entry{grid-template-columns:1fr;grid-template-areas:"name" "content" "ops"}
  .entry .name{grid-area:name}
  .entry .content{grid-area:content}
  .entry .ops{grid-area:ops;grid-template-columns:repeat(4,1fr)}
  .main-head{flex-wrap:wrap}
  .search{width:100%}
}
</style>
</head>
<body>
<div class="app">
  <aside class="card side">
    <h1>黑话库<small>astrbot_plugin_slang</small></h1>
    <div id="nav"></div>
    <div class="side-foot">
      <button id="settingsBtn">⚙ 设置</button>
      <div id="diag" style="font-size:11px;color:var(--muted);padding:4px 4px 0"></div>
    </div>
  </aside>

  <main class="card main">
    <div class="main-head">
      <h2><span id="title">全局黑话</span> <span id="subtitle"></span></h2>
      <input class="search" type="search" id="searchInput" placeholder="搜索词条或含义…（/ 聚焦）" />
      <button class="primary" id="addBtn">+ 手动录入</button>
    </div>
    <div id="list"></div>
  </main>
</div>

<!-- 修改弹窗 -->
<div class="mask" id="editMask">
  <div class="card modal">
    <h3>修改词条</h3>
    <div class="field"><label>词条名</label><input id="editName" maxlength="32" /></div>
    <div class="field"><label>内容</label><textarea id="editMeaning" maxlength="500"></textarea></div>
    <div class="field"><label>归属</label><select id="editScope"></select></div>
    <div class="modal-foot">
      <button class="link" id="editCancel">取消</button>
      <button class="primary" id="editSave">确认</button>
    </div>
  </div>
</div>

<!-- 录入弹窗 -->
<div class="mask" id="addMask">
  <div class="card modal">
    <h3>手动录入</h3>
    <div class="field"><label>词条名</label><input id="addName" maxlength="32" placeholder="例如：梁文谷" /></div>
    <div class="field"><label>内容</label><textarea id="addMeaning" maxlength="500" placeholder="例如：对梁文锋的戏称，调侃峰谷定价"></textarea></div>
    <div class="field"><label>作用域</label><select id="addScope"></select></div>
    <div class="modal-foot">
      <button class="link" id="addCancel">取消</button>
      <button class="primary" id="addSave">确认</button>
    </div>
  </div>
</div>

<!-- 设置弹窗 -->
<div class="mask" id="setMask">
  <div class="card modal">
    <h3>设置</h3>
    <div class="field"><label>分析模型</label><select id="providerSelect"></select></div>
    <div class="form-row">
      <div class="field"><label>学习频率</label><input type="number" id="cfgFreq" min="5" max="10000" /></div>
      <div class="field"><label>提取上限</label><input type="number" id="cfgExtract" min="1" max="100" /></div>
      <div class="field"><label>注入上限</label><input type="number" id="cfgInject" min="1" max="50" /></div>
    </div>
    <div class="field" style="flex-direction:row;align-items:center;gap:8px">
      <input type="checkbox" id="enabledSwitch" style="width:auto" /><label style="margin:0">总开关</label>
    </div>
    <div class="field" style="flex-direction:row;align-items:center;gap:8px">
      <input type="checkbox" id="wikiSyncEnable" style="width:auto" /><label style="margin:0">自动同步梗百科</label>
    </div>
    <div class="form-row">
      <div class="field"><label>同步间隔（天）</label><input type="number" id="wikiSyncDays" min="1" max="365" /></div>
      <div class="field"><label>每天几点检查</label><input type="time" id="wikiSyncTime" /></div>
    </div>
    <div class="field"><small id="wikiMeta" style="color:var(--muted);font-size:11px"></small></div>
    <div class="modal-foot">
      <button class="link" id="setCancel">取消</button>
      <button class="primary" id="setSave">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/api/plugin/page/bridge-sdk.js"></script>
<script>
const PLUGIN = "astrbot_plugin_slang";
const $ = id => document.getElementById(id);
const state = { bucket: "manual", scope: "", search: "", tree: null,
  cache: new Map(), collapsed: new Set() };

function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("show"), 2600);
}
window.addEventListener("error", e => toast("页面脚本出错：" + (e.message || "未知")));
window.addEventListener("unhandledrejection", e =>
  toast("请求失败：" + ((e.reason && e.reason.message) || e.reason || "未知")));
function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, c =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function normalize(raw){
  if (raw && typeof raw === "object" && "status" in raw) return raw;
  return { status: "ok", message: "", data: raw || {} };
}
async function api(endpoint, payload = {}){
  const bridge = window.AstrBotPluginPage;
  if (bridge && typeof bridge.apiPost === "function"){
    return normalize(await bridge.apiPost(endpoint, payload));
  }
  for (const url of [`/api/plug/${PLUGIN}/${endpoint}`,
                     `/api/plugin/${PLUGIN}/${endpoint}`]){
    try {
      const res = await fetch(url, {
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify(payload),
      });
      if (res.ok) return normalize(await res.json());
    } catch (e) { /* 继续试下一个 */ }
  }
  throw new Error("接口不可达（bridge 与 fetch 都失败）");
}

/* ---------- 左栏 ---------- */
function renderNav(){
  const tree = state.tree;
  if (!tree) return;
  const keep = tree.buckets.filter(b => b.key !== "global");
  $("nav").innerHTML = keep.map(b => {
    const active = (state.bucket === b.key && !state.scope) ? " active" : "";
    const collapsed = state.collapsed.has(b.key);
    const caret = (b.subs && b.subs.length) ? (collapsed ? "▸" : "▾") : "";
    let html = `<div class="nav${active}" data-bucket="${b.key}">
      <span class="caret">${caret}</span>
      <span class="label-text">${esc(b.label)}</span>
      <span class="count">${b.count}</span></div>`;
    if (b.subs && b.subs.length && !collapsed){
      html += `<div class="subs">` + b.subs.map(s => {
        const on = (state.bucket === b.key && state.scope === s.scope) ? " active" : "";
        const label = s.scope ? (s.name || "未命名群") : "全局";
        const gid = s.scope ? `<span class="gid">[${esc(s.scope)}]</span>` : "";
        return `<div class="sub${on}" data-bucket="${b.key}" data-scope="${esc(s.scope)}">
          <span class="label"><span class="gname">${esc(label)}</span>${gid}</span>
          <span class="count">${s.count}</span></div>`;
      }).join("") + `</div>`;
    }
    return html;
  }).join("");
}

/* ---------- 右栏 ---------- */
function titleOf(){
  const label = {global:"全局黑话", manual:"手动黑话", group:"群黑话",
    pending:"待审黑话", wiki:"梗百科"}[state.bucket] || "全部";
  const activeBucket = state.tree ? state.tree.buckets.find(b => b.key === state.bucket) : null;
  if (state.scope){
    const sub = activeBucket && activeBucket.subs.find(s => s.scope === state.scope);
    return `${label} · ${sub && sub.name ? sub.name : "群"} [${state.scope}]`;
  }
  if (state.bucket === "manual" && activeBucket) return label;
  return label;
}

function fillScope(sel, current){
  const opts = [`<option value="__global__">全局（所有群）</option>`];
  if (state.tree){
    const seen = new Set();
    state.tree.buckets.forEach(b => (b.subs || []).forEach(s => {
      if (s.scope && !seen.has(s.scope)){
        seen.add(s.scope);
        opts.push(`<option value="${esc(s.scope)}">${esc(s.name || "未命名群")} [${esc(s.scope)}]</option>`);
      }
    }));
  }
  sel.innerHTML = opts.join("");
  sel.value = current || "__global__";
  if (sel.selectedIndex < 0) sel.value = "__global__";
}

function entryHTML(it){
  if (it.read_only){
    return `
    <div class="entry" data-id="${it.id}">
      <div class="name">${esc(it.content)}</div>
      <div class="content">
        <div class="meaning">${esc(it.meaning) || "（没有摘要）"}</div>
        <div class="meta">梗百科 · 只读${it.tags ? " · " + esc(it.tags) : ""}</div>
      </div>
      <div class="ops"><button class="btn" disabled style="grid-column:1/-1">只读</button></div>
    </div>`;
  }
  const isManual = !!it.manual_review;
  const isAuto = !!it.auto_review;
  const note = it.auto_note ? `自审：${esc(it.auto_note)}` : "";
  const meta = [`×${it.count}`,
    it.updated_at ? new Date(it.updated_at * 1000).toLocaleString("zh-CN",{hour12:false}).slice(5,16) : "",
    note].filter(Boolean).join(" · ");
  return `
  <div class="entry" data-id="${it.id}">
    <div class="name">${esc(it.content)}</div>
    <div class="content">
      <div class="meaning">${esc(it.meaning) || "（没有含义）"}</div>
      <div class="meta">${meta}</div>
    </div>
    <div class="ops">
      <button class="btn ${isAuto ? "on" : "off"}" data-act="auto">自审 ${isAuto ? "✓" : "✗"}</button>
      <button class="btn ${isManual ? "on" : "off"}" data-act="manual">人工 ${isManual ? "✓" : "✗"}</button>
      <button class="btn" data-act="edit">修改</button>
      <button class="btn danger" data-act="del">删除</button>
    </div>
  </div>`;
}

async function loadTree(){
  const r = await api("kb/tree", {});
  if (r.status !== "ok") throw new Error(r.message || "接口返回错误");
  if (!r.data || !Array.isArray(r.data.buckets)) throw new Error("返回结构异常");
  state.tree = r.data; renderNav();
}

async function loadList(){
  const r = await api("kb/list", { bucket: state.bucket, scope: state.scope, search: state.search, size: 200 });
  if (r.status !== "ok") throw new Error(r.message || "接口返回错误");
  const d = r.data;
  state.cache.clear();
  (d.items || []).forEach(it => state.cache.set(it.id, it));
  $("title").textContent = titleOf();
  $("subtitle").textContent = `${d.total} 条`;
  $("list").innerHTML = (d.items || []).length
    ? d.items.map(entryHTML).join("")
    : `<div class="empty">这里还没有词条</div>`;
}

async function ping(){
  try {
    const r = await api("kb/ping", {});
    if (r.status === "ok"){
      $("diag").textContent =
        `自检 ok · ${r.data.rows} 条 · ${r.data.schema} · 梗库 ${r.data.wiki ?? 0} · build ${r.data.build || "?"}`;
    } else {
      $("diag").textContent = "自检失败：" + (r.message || "");
    }
  } catch (e) {
    $("diag").textContent = "自检异常：" + (e.message || e);
  }
}

async function reload(){
  await ping();
  try { await loadTree(); }
  catch (e) {
    $("nav").innerHTML =
      `<div class="nav" style="color:var(--danger);background:var(--danger-soft)">侧栏加载失败：${esc(e.message)}</div>`;
  }
  try { await loadList(); }
  catch (e) {
    $("list").innerHTML =
      `<div class="empty" style="color:var(--danger)">列表加载失败：${esc(e.message)}</div>`;
  }
}

/* ---------- 导航 ---------- */
$("nav").addEventListener("click", e => {
  const sub = e.target.closest(".sub");
  if (sub){
    state.bucket = sub.dataset.bucket; state.scope = sub.dataset.scope;
  } else {
    const nav = e.target.closest(".nav"); if (!nav) return;
    const key = nav.dataset.bucket;
    // 再点一次当前父列表 = 折叠/展开子列表
    if (state.bucket === key && !state.scope && (state.tree || [])){
      const b = state.tree.buckets.find(x => x.key === key);
      if (b && b.subs && b.subs.length){
        if (state.collapsed.has(key)) state.collapsed.delete(key);
        else state.collapsed.add(key);
        renderNav();
        return;
      }
    }
    state.bucket = key; state.scope = "";
    state.collapsed.delete(key);
  }
  state.search = ""; $("searchInput").value = "";
  renderNav(); loadList();
});

/* ---------- 条目操作 ---------- */
$("list").addEventListener("click", async e => {
  const btn = e.target.closest("button[data-act]"); if (!btn) return;
  const row = btn.closest(".entry"); const it = state.cache.get(Number(row.dataset.id));
  if (!it) return;
  const act = btn.dataset.act;

  if (act === "auto"){
    const r = await api("kb/set_review", { content: it.content, field: "auto", value: !it.auto_review });
    toast(r.message); if (r.status === "ok") reload(); return;
  }
  if (act === "manual"){
    const r = await api("kb/approve", { content: it.content, value: !it.manual_review });
    toast(r.message); if (r.status === "ok") reload(); return;
  }
  if (act === "global"){
    const r = await api("kb/toggle_global", { content: it.content });
    toast(r.message); if (r.status === "ok") reload(); return;
  }
  if (act === "del"){
    if (!btn.dataset.armed){
      btn.dataset.armed = "1"; btn.classList.add("armed"); btn.textContent = "再点一次";
      setTimeout(() => { btn.dataset.armed=""; btn.classList.remove("armed"); btn.textContent="删除"; }, 2600);
      return;
    }
    const r = await api("kb/delete", { content: it.content });
    toast(r.message); if (r.status === "ok") reload(); return;
  }
  if (act === "edit"){
    editing = it;
    $("editName").value = it.content;
    $("editMeaning").value = it.meaning || "";
    fillScope($("editScope"), it.scope || "");
    $("editMask").classList.add("on");
    $("editName").focus();
    return;
  }
});

let editing = null;
$("editCancel").onclick = () => $("editMask").classList.remove("on");
$("editSave").onclick = async () => {
  if (!editing) return;
  const name = $("editName").value.trim();
  const meaning = $("editMeaning").value.trim();
  if (!name || !meaning) return toast("词条名和内容都不能为空");
  const r = await api("kb/update", { content: editing.content, name, meaning, scope: $("editScope").value });
  toast(r.message);
  if (r.status === "ok"){ $("editMask").classList.remove("on"); editing = null; reload(); }
};

/* ---------- 录入 ---------- */
function fillScopeSelect(){
  fillScope($("addScope"), "__global__");
}
$("addBtn").onclick = async () => {
  if (!state.tree) await loadTree();
  fillScopeSelect();
  $("addName").value = ""; $("addMeaning").value = "";
  $("addMask").classList.add("on");
  $("addName").focus();
};
$("addCancel").onclick = () => $("addMask").classList.remove("on");
$("addSave").onclick = async () => {
  const name = $("addName").value.trim();
  const meaning = $("addMeaning").value.trim();
  const scope = $("addScope").value;
  if (!name || !meaning) return toast("词条名和内容都不能填");
  const r = await api("kb/add", { content: name, meaning, scope });
  toast(r.message);
  if (r.status === "ok"){ $("addMask").classList.remove("on"); reload(); }
};

/* ---------- 设置 ---------- */
$("settingsBtn").onclick = async () => {
  const r = await api("kb/config", {});
  if (r.status === "ok"){
    const d = r.data;
    $("providerSelect").innerHTML = `<option value="">跟随主模型</option>` +
      (d.providers || []).map(p => `<option value="${esc(p.id)}">${esc(p.id)}</option>`).join("");
    $("providerSelect").value = d.provider_id || "";
    $("cfgFreq").value = d.learn_frequency;
    $("cfgExtract").value = d.extract_max;
    $("cfgInject").value = d.inject_max;
  $("wikiSyncEnable").checked = !!d.wiki_sync_enable;
  $("wikiSyncDays").value = d.wiki_sync_interval_days ?? 7;
  $("wikiSyncTime").value = d.wiki_sync_time || "04:30";
  const last = d.wiki_synced_at ? new Date(Number(d.wiki_synced_at) * 1000)
    .toLocaleString("zh-CN", {hour12: false}) : "从未";
  $("wikiMeta").textContent = `梗库 ${d.wiki_count ?? 0} 条 · 上次同步 ${last}`;
  }
  $("setMask").classList.add("on");
};
$("setCancel").onclick = () => $("setMask").classList.remove("on");
$("setSave").onclick = async () => {
  const r = await api("kb/config", {
    provider_id: $("providerSelect").value,
    learn_frequency: Number($("cfgFreq").value),
    extract_max: Number($("cfgExtract").value),
    inject_max: Number($("cfgInject").value),
    wiki_sync_enable: $("wikiSyncEnable").checked,
    wiki_sync_interval_days: Number($("wikiSyncDays").value),
    wiki_sync_time: $("wikiSyncTime").value,
  });
  toast(r.message || "已保存");
  $("setMask").classList.remove("on");
};
$("enabledSwitch").onchange = async () => {
  const r = await api("kb/switch", { enabled: $("enabledSwitch").checked });
  toast(r.message);
};

/* ---------- 搜索与快捷键 ---------- */
let searchTimer;
$("searchInput").oninput = () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { state.search = $("searchInput").value.trim(); loadList(); }, 300);
};
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== $("searchInput")){
    e.preventDefault(); $("searchInput").focus();
  }
  if (e.key === "Escape"){
    document.querySelectorAll(".mask.on").forEach(m => m.classList.remove("on"));
  }
});

reload();
</script>
</body>
</html>
