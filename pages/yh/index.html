<!doctype html>
<html lang="zh-CN">
<head>
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>黑话审核台 · lite</title>
<style>
:root{
  --bg:#eef0f4; --card:#fff; --bubble:#f4f5f8; --text:#1b1c1f; --muted:#85868c;
  --line:#e6e7eb; --accent:#0a6cff; --accent-soft:#e8f0ff;
  --ok:#0f8a44; --ok-soft:#e7f7ee; --danger:#c0392b; --danger-soft:#fff2f1;
  --warn:#b26a00; --warn-soft:#fff4e5;
}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);
  font:14px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased}
.app{display:flex;gap:14px;max-width:1200px;margin:0 auto;padding:18px;align-items:flex-start}
.card{background:var(--card);border-radius:16px;
  box-shadow:0 1px 2px rgba(20,20,40,.04),0 10px 28px rgba(20,20,40,.05)}

/* 左栏 */
.side{width:252px;flex:0 0 252px;padding:14px;position:sticky;top:18px}
.side h1{font-size:15px;font-weight:650;margin:2px 4px 14px}
.side h1 small{display:block;font-size:11px;color:var(--muted);font-weight:400;margin-top:2px}
.nav,.sub{width:100%}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:9px 12px;border-radius:12px;background:var(--bubble);margin-bottom:14px;
  cursor:pointer;font-weight:600;font-size:13.5px;transition:background .15s}
.nav:hover{background:#eceef3}
.nav.active{background:var(--accent-soft);color:#0a5ad4}
.nav .caret{font-size:10px;color:var(--muted);margin-right:2px;width:10px}
.nav .label-text{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav .count,.sub .count{display:inline-flex;align-items:center;justify-content:center;
  min-width:22px;height:22px;padding:0 6px;border-radius:999px;
  background:#e4e6ec;color:#4a4b51;font-size:11.5px;font-weight:700;line-height:1;
  flex:0 0 auto}
.nav.active .count{background:#d3e2ff;color:#0a5ad4}
.sub .count{min-width:18px;height:18px;font-size:11px;background:#e9eaef}
.subs{display:flex;flex-direction:column;gap:7px;margin:0 0 14px}
.sub{display:flex;align-items:center;justify-content:space-between;gap:6px;
  min-height:42px;padding:5px 8px 5px 22px;border-radius:9px;font-size:12.5px;color:#5b5c62;
  cursor:pointer;transition:background .15s}
.sub:hover{background:#f4f5f8}
.sub.active{background:var(--accent-soft);color:#0a5ad4}
.sub .label{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.sub .gname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.sub .gid{font-size:11px;color:var(--muted);white-space:nowrap}
.side-foot{margin-top:8px}
.side-foot button{border:none;background:none;color:var(--muted);font-size:12px;cursor:pointer;padding:4px}
.side-foot button:hover{color:var(--accent)}

/* 右栏 */
.main{flex:1;min-width:0;padding:16px;min-height:calc(100vh - 36px)}
.main-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.main-head h2{font-size:16px;font-weight:650;flex:1;min-width:0;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.main-head h2 span{font-size:12px;color:var(--muted);font-weight:400;margin-left:6px}
.search{width:220px;flex:1 1 160px;min-width:0}
#addBtn{flex:0 0 auto;white-space:nowrap}
.sort{flex:0 0 auto;width:104px;padding:8px 10px;border:1px solid var(--line);
  border-radius:10px;background:#fff;font:inherit;font-size:12.5px;color:#3a3b40;
  cursor:pointer}

.bulkbar{display:none;align-items:center;gap:12px;margin:-2px 0 12px;
  padding:8px 12px;border:1px solid var(--line);border-radius:10px;
  font-size:12.5px;color:#5b5c62}
.bulkbar.show{display:flex}
.bulkbar .pickall{display:flex;align-items:center;gap:6px;cursor:pointer}
.bulkbar .btn{padding:5px 12px;font-size:12px}
.entry{display:grid;grid-template-columns:minmax(64px,110px) 1fr 172px;
  gap:12px;align-items:center;background:var(--bubble);border-radius:14px;
  padding:12px 14px;margin-bottom:10px}
.entry.pending{grid-template-columns:26px minmax(64px,110px) 1fr 172px}
.entry .pick{width:auto;margin:0;cursor:pointer}
.entry .name{font-weight:650;font-size:14px;word-break:break-all}
.entry .content{min-width:0}
.meaning{color:#3a3b40;word-break:break-word}
.meta{font-size:11.5px;color:var(--muted);margin-top:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ops{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.btn{font:inherit;font-size:11.5px;padding:6px 2px;border-radius:9px;cursor:pointer;
  border:1px solid var(--line);background:#fff;color:#4a4b51;white-space:nowrap;
  transition:background .12s,border-color .12s}
.btn:hover{border-color:#d3d4da}
.btn.on{background:var(--ok-soft);border-color:#bfe8d0;color:var(--ok)}
.btn.off{background:var(--danger-soft);border-color:#f3cfcb;color:var(--danger)}
.btn:disabled{opacity:.4;cursor:default}
.btn.danger{background:var(--danger-soft);border-color:#f3cfcb;color:var(--danger)}
.btn.danger:hover{background:#ffe5e2}
.btn.danger.armed{background:var(--danger);border-color:var(--danger);color:#fff}
.empty{color:var(--muted);text-align:center;padding:64px 0}
.pager{display:flex;align-items:center;justify-content:center;gap:14px;
  margin-top:14px;font-size:13px;color:var(--muted)}
.pager button{border:1px solid var(--line);background:#fff;border-radius:8px;
  padding:5px 12px;cursor:pointer;font:inherit;font-size:13px}
.pager button:disabled{opacity:.4;cursor:default}
.set-group{margin-bottom:6px}
.set-group + .set-group{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.set-title{font-size:12px;color:var(--muted);font-weight:600;margin:2px 0 8px}
.set-row{display:flex;align-items:center;gap:8px;font-size:13px;color:#3a3b40;
  padding:5px 0;cursor:pointer}
.set-row input{width:auto}

input,select,textarea,button{font:inherit;color:var(--text);background:#fff;
  border:1px solid var(--line);border-radius:9px;padding:6px 10px}
input,textarea,select{width:100%}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
textarea{resize:vertical;min-height:96px;line-height:1.5}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{background:#0057d6}
button.link{border:none;background:none;color:var(--accent);padding:6px 10px;cursor:pointer}

.mask{position:fixed;inset:0;background:rgba(20,20,30,.28);display:none;
  align-items:center;justify-content:center;padding:20px;z-index:20}
.mask.on{display:flex}
.modal{width:min(520px,100%);padding:18px;max-height:86vh;overflow:auto}
.modal h3{font-size:15px;margin-bottom:14px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:12px;color:var(--muted)}
.label-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.counter{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.counter.over{color:var(--danger);font-weight:600}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.form-row{display:flex;gap:10px;flex-wrap:wrap}
.form-row .field{flex:1;min-width:140px}

.mask.alert{z-index:40}

@media (max-width:820px){
  .app{flex-direction:column;padding:12px}
  .side{width:100%;flex:none;position:static}
  .entry{grid-template-columns:1fr;grid-template-areas:"name" "content" "ops"}
  .entry .name{grid-area:name}
  .entry .content{grid-area:content}
  .entry .ops{grid-area:ops;grid-template-columns:repeat(4,1fr)}
  .main-head{flex-wrap:wrap}
  .search{width:100%}
}
</style>
</head>
<body>
<div class="app">
  <aside class="card side">
    <h1>群语汇<small>astrbot_plugin_slang</small></h1>
    <div id="nav"></div>
    <div class="side-foot">
      <button id="settingsBtn">⚙ 设置</button>
      <div id="diag" style="font-size:11px;color:var(--muted);padding:4px 4px 0"></div>
    </div>
  </aside>

  <main class="card main">
    <div class="main-head">
      <h2><span id="title">全局黑话</span> <span id="subtitle"></span></h2>
      <select class="sort" id="sortSelect" title="排序方式">
        <option value="recent">最新优先</option>
        <option value="count">次数优先</option>
      </select>
      <input class="search" type="search" id="searchInput" placeholder="搜索词条或含义…（/ 聚焦）" />
      <button class="primary" id="addBtn">+ 手动录入</button>
    </div>
    <div class="bulkbar" id="bulkBar">
      <label class="pickall"><input type="checkbox" id="bulkAll" /> 全选本页</label>
      <span id="bulkCount">已选 0 条</span>
      <span style="flex:1"></span>
      <button class="btn" id="bulkApprove" disabled>通过所选</button>
      <button class="btn danger" id="bulkDelete" disabled>删除所选</button>
    </div>
    <div id="list"></div>
    <div class="pager" id="pager" style="display:none"></div>
  </main>
</div>

<!-- 修改弹窗 -->
<div class="mask" id="editMask">
  <div class="card modal">
    <h3>修改词条</h3>
    <div class="field"><label>词条名</label><input id="editName" maxlength="32" /></div>
    <div class="field"><label>关键词</label><input id="editKeywords" maxlength="300" placeholder="触发词，逗号分隔；不填则只用词条名" /></div>
    <div class="field">
      <div class="label-row"><label>内容</label><span class="counter" id="editCount">0/200</span></div>
      <textarea id="editMeaning" placeholder="这条词条注入给模型的含义"></textarea>
    </div>
    <div class="field"><label>归属</label><select id="editScope"></select></div>
    <div class="modal-foot">
      <div id="editErr" style="display:none;color:var(--danger);font-size:12px;margin-bottom:8px;line-height:1.5"></div>
      <button class="link" id="editCancel">取消</button>
      <button class="primary" id="editSave">确认</button>
    </div>
  </div>
</div>

<!-- 录入弹窗 -->
<div class="mask" id="addMask">
  <div class="card modal">
    <h3>手动录入</h3>
    <div class="field"><label>词条名</label><input id="addName" maxlength="32" placeholder="例如：梁文锋" /></div>
    <div class="field"><label>关键词</label><input id="addKeywords" maxlength="300" placeholder="触发词，逗号分隔；例如：梁文峰,梁文谷" /></div>
    <div class="field">
      <div class="label-row"><label>内容</label><span class="counter" id="addCount">0/200</span></div>
      <textarea id="addMeaning" placeholder="例如：DeepSeek 创始人"></textarea>
    </div>
    <div class="field"><label>作用域</label><select id="addScope"></select></div>
    <div class="modal-foot">
      <button class="link" id="addCancel">取消</button>
      <button class="primary" id="addSave">确认</button>
    </div>
  </div>
</div>

<!-- 设置弹窗 -->
<div class="mask" id="setMask">
  <div class="card modal">
    <h3>设置</h3>
    <div id="setBody"></div>
    <div class="field"><small id="wikiMeta" style="color:var(--muted);font-size:11px"></small></div>
    <div class="modal-foot">
      <button class="link" id="setCancel">取消</button>
      <button class="primary" id="setSave">保存</button>
    </div>
  </div>
</div>

<div class="mask alert" id="alertMask">
  <div class="card modal" style="width:min(420px,100%)">
    <h3 id="alertTitle">提示</h3>
    <div id="alertBody" style="font-size:13px;line-height:1.7;white-space:pre-wrap;color:#3a3b40"></div>
    <div class="modal-foot"><button class="link" id="alertCancel" style="display:none">取消</button><button class="primary" id="alertOk">知道了</button></div>
  </div>
</div>


<script src="/api/plugin/page/bridge-sdk.js"></script>
<script>
const PLUGIN = "astrbot_plugin_slang";
const PAGE_BUILD = "v1.5.0";
const $ = id => document.getElementById(id);
const state = { bucket: "manual", scope: "", scopeSel: false, search: "", tree: null,
  cache: new Map(), collapsed: new Set(), page: 1, size: 50, sort: "recent",
  selected: new Set() };

let alertOkHandler = null;
function showAlert(msg, title = "提示"){
  $("alertTitle").textContent = title;
  $("alertBody").textContent = msg || "服务器没有返回内容";
  $("alertOk").textContent = "知道了";
  $("alertCancel").style.display = "none";
  alertOkHandler = null;
  $("alertMask").classList.add("on");
}
function showConfirm(msg, title, onOk){
  showAlert(msg, title);
  $("alertOk").textContent = "仍要新建";
  $("alertCancel").style.display = "";
  alertOkHandler = onOk;
}
$("alertOk").onclick = () => {
  $("alertMask").classList.remove("on");
  const fn = alertOkHandler; alertOkHandler = null;
  if (fn) fn();
};
$("alertCancel").onclick = () => {
  $("alertMask").classList.remove("on");
  alertOkHandler = null;
};

function callApi(ep, payload, ms = 10000){
  return Promise.race([
    api(ep, payload),
    new Promise((_, reject) => setTimeout(() => reject(new Error("请求超时（10 秒）")), ms)),
  ]);
}

function showResult(r, okTitle = "完成"){
  if (r.status === "ok") showAlert(r.message || "操作成功", okTitle);
  else showAlert(r.message || "操作失败：服务器未返回原因", "操作失败");
}

window.addEventListener("error", e => showAlert("页面脚本出错：" + (e.message || "未知"), "页面出错"));
window.addEventListener("unhandledrejection", e =>
  showAlert("请求失败：" + ((e.reason && e.reason.message) || e.reason || "未知"), "请求失败"));
function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, c =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function normalize(raw){
  if (raw && typeof raw === "object" && "status" in raw) return raw;
  return { status: "ok", message: "", data: raw || {} };
}
async function api(endpoint, payload = {}){
  const bridge = window.AstrBotPluginPage;
  if (bridge && typeof bridge.apiPost === "function"){
    return normalize(await bridge.apiPost(endpoint, payload));
  }
  for (const url of [`/api/plug/${PLUGIN}/${endpoint}`,
                     `/api/plugin/${PLUGIN}/${endpoint}`]){
    try {
      const res = await fetch(url, {
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify(payload),
      });
      if (res.ok) return normalize(await res.json());
    } catch (e) { /* 继续试下一个 */ }
  }
  throw new Error("接口不可达（bridge 与 fetch 都失败）");
}

/* ---------- 左栏 ---------- */
function renderNav(){
  const tree = state.tree;
  if (!tree) return;
  const keep = tree.buckets.filter(b => b.key !== "global");
  $("nav").innerHTML = keep.map(b => {
    const active = (state.bucket === b.key && !state.scopeSel) ? " active" : "";
    const collapsed = state.collapsed.has(b.key);
    const caret = (b.subs && b.subs.length) ? (collapsed ? "▸" : "▾") : "";
    let html = `<div class="nav${active}" data-bucket="${b.key}">
      <span class="caret">${caret}</span>
      <span class="label-text">${esc(b.label)}</span>
      <span class="count">${b.count}</span></div>`;
    if (b.subs && b.subs.length && !collapsed){
      html += `<div class="subs">` + b.subs.map(s => {
        const on = (state.bucket === b.key && state.scopeSel && state.scope === s.scope) ? " active" : "";
        const label = s.scope ? (s.name || "未命名群") : "全局";
        const gid = s.scope
          ? `<span class="gid">[${esc(s.scope)}]</span>`
          : `<span class="gid">所有群通用</span>`;
        return `<div class="sub${on}" data-bucket="${b.key}" data-scope="${esc(s.scope)}">
          <span class="label"><span class="gname">${esc(label)}</span>${gid}</span>
          <span class="count">${s.count}</span></div>`;
      }).join("") + `</div>`;
    }
    return html;
  }).join("");
}

/* ---------- 右栏 ---------- */
function titleOf(){
  const label = {manual:"手动", auto:"黑话库", pending:"待审", wiki:"梗百科"}[state.bucket] || "全部";
  const activeBucket = state.tree ? state.tree.buckets.find(b => b.key === state.bucket) : null;
  if (state.scopeSel){
    if (!state.scope) return `${label} · 全局`;
    const sub = activeBucket && activeBucket.subs.find(s => s.scope === state.scope);
    return `${label} · ${sub && sub.name ? sub.name : "群"} [${state.scope}]`;
  }
  if (state.bucket === "manual" && activeBucket) return label;
  return label;
}

function fillScope(sel, current){
  const opts = [`<option value="__global__">全局（所有群）</option>`];
  if (state.tree){
    const seen = new Set();
    state.tree.buckets.forEach(b => (b.subs || []).forEach(s => {
      if (s.scope && !seen.has(s.scope)){
        seen.add(s.scope);
        opts.push(`<option value="${esc(s.scope)}">${esc(s.name || "未命名群")} [${esc(s.scope)}]</option>`);
      }
    }));
  }
  sel.innerHTML = opts.join("");
  sel.value = current || "__global__";
  if (sel.selectedIndex < 0) sel.value = "__global__";
}

function entryHTML(it){
  if (it.read_only){
    return `
    <div class="entry" data-id="${it.id}">
      <div class="name">${esc(it.content)}</div>
      <div class="content">
        <div class="meaning">${esc(it.meaning) || "（没有摘要）"}</div>
        <div class="meta">梗百科 · 只读${it.tags ? " · " + esc(it.tags) : ""}</div>
      </div>
      <div class="ops"><button class="btn" disabled style="grid-column:1/-1">只读</button></div>
    </div>`;
  }
  const src = it.source === "manual" ? "手动" : "自动";
  const scope = it.is_global ? "全局" : `群 ${esc(it.scope)}`;
  const note = it.auto_note ? `理由：${esc(it.auto_note)}` : "";
  const who = it.contributor ? `来源：${esc(it.contributor)}` : "";
  const meta = [src, scope, who, `×${it.count}`,
    it.updated_at ? new Date(it.updated_at * 1000).toLocaleString("zh-CN",{hour12:false}).slice(5,16) : "",
    note].filter(Boolean).join(" · ");
  const pick = it.pending
    ? `<input type="checkbox" class="pick" data-id="${it.id}" ${state.selected.has(String(it.id)) ? "checked" : ""} />`
    : "";
  return `
  <div class="entry${it.pending ? " pending" : ""}" data-id="${it.id}">
    ${pick}
    <div class="name">${esc(it.content)}</div>
    <div class="content">
      <div class="meaning">${esc(it.meaning) || "（没有含义）"}</div>
      ${it.keywords ? `<div class="meta">关键词：${esc(it.keywords)}</div>` : ""}
      <div class="meta">${meta}</div>
    </div>
    <div class="ops">
      <button class="btn ${it.pending ? "on" : ""}" data-act="approve">${it.pending ? "审核" : "驳回"}</button>
      <button class="btn" data-act="edit">修改</button>
      <button class="btn danger" data-act="del">删除</button>
    </div>
  </div>`;
}

async function loadTree(){
  const r = await api("yh/tree", {});
  if (r.status !== "ok") throw new Error(r.message || "接口返回错误");
  if (!r.data || !Array.isArray(r.data.buckets)) throw new Error("返回结构异常");
  state.tree = r.data; renderNav();
}

async function loadList(){
  $("sortSelect").style.display = state.bucket === "wiki" ? "none" : "";
  $("addBtn").style.display = state.bucket === "manual" ? "" : "none";
  const r = await api("yh/list", { bucket: state.bucket, scope: state.scope,
    scoped: state.scopeSel, search: state.search, page: state.page,
    size: state.size, sort: state.sort });
  if (r.status !== "ok") throw new Error(r.message || "接口返回错误");
  const d = r.data;
  state.cache.clear();
  (d.items || []).forEach(it => state.cache.set(String(it.id), it));
  $("title").textContent = titleOf();
  $("subtitle").textContent = `${d.total} 条`;
  state.selected.clear();
  $("list").innerHTML = (d.items || []).length
    ? d.items.map(entryHTML).join("")
    : `<div class="empty">这里还没有词条</div>`;
  syncBulk();
  renderPager(d.total, d.page || state.page, d.size || state.size);
}

function renderPager(total, page, size){
  const box = $("pager");
  const pages = Math.max(1, Math.ceil(total / size));
  if (total <= size){ box.style.display = "none"; return; }
  box.style.display = "flex";
  box.innerHTML = `<button id="pgPrev" ${page <= 1 ? "disabled" : ""}>上一页</button>
    <span>第 ${page} / ${pages} 页 · 共 ${total} 条</span>
    <button id="pgNext" ${page >= pages ? "disabled" : ""}>下一页</button>`;
  $("pgPrev").onclick = () => { if (page > 1){ state.page = page - 1; loadList(); } };
  $("pgNext").onclick = () => { if (page < pages){ state.page = page + 1; loadList(); } };
}

async function ping(){
  try {
    const r = await api("yh/ping", {});
    if (r.status === "ok"){
      $("diag").textContent =
        `自检 ok · ${r.data.rows} 条 · 梗库 ${r.data.wiki ?? 0} · 页面 ${PAGE_BUILD}`;
    } else {
      $("diag").textContent = "自检失败：" + (r.message || "");
    }
  } catch (e) {
    $("diag").textContent = "自检异常：" + (e.message || e);
  }
}

async function reload(){
  await ping();
  try { await loadTree(); }
  catch (e) {
    $("nav").innerHTML =
      `<div class="nav" style="color:var(--danger);background:var(--danger-soft)">侧栏加载失败：${esc(e.message)}</div>`;
  }
  try { await loadList(); }
  catch (e) {
    $("list").innerHTML =
      `<div class="empty" style="color:var(--danger)">列表加载失败：${esc(e.message)}</div>`;
  }
}

/* ---------- 导航 ---------- */
$("nav").addEventListener("click", e => {
  const sub = e.target.closest(".sub");
  if (sub){
    state.bucket = sub.dataset.bucket;
    state.scope = sub.dataset.scope;
    state.scopeSel = true;
  } else {
    const nav = e.target.closest(".nav"); if (!nav) return;
    const key = nav.dataset.bucket;
    // 再点一次当前父列表 = 折叠/展开子列表
    if (state.bucket === key && !state.scopeSel && (state.tree || [])){
      const b = state.tree.buckets.find(x => x.key === key);
      if (b && b.subs && b.subs.length){
        if (state.collapsed.has(key)) state.collapsed.delete(key);
        else state.collapsed.add(key);
        renderNav();
        return;
      }
    }
    state.bucket = key; state.scope = ""; state.scopeSel = false;
    state.collapsed.delete(key);
  }
  state.search = ""; $("searchInput").value = "";
  state.page = 1;
  renderNav(); loadList();
});

/* ---------- 条目操作 ---------- */
$("list").addEventListener("click", async e => {
  const btn = e.target.closest("button[data-act]"); if (!btn) return;
  const row = btn.closest(".entry"); const it = state.cache.get(String(row.dataset.id));
  if (!it) return;
  const act = btn.dataset.act;

  if (act === "approve"){
    if (!it.table){ showAlert("页面是旧版本，缺少表字段。请按 Ctrl+F5 强制刷新后重试。", "需要刷新"); return; }
    try {
      const r = await callApi("yh/approve", { table: it.table, name: it.content, scope: it.scope });
      showResult(r); if (r.status === "ok") reload();
    } catch (e) {
      showAlert("请求失败：" + ((e && e.message) || e), "操作失败");
    }
    return;
  }
  if (act === "global"){
    try {
      const r = await callApi("yh/toggle_global", { table: it.table, name: it.content, scope: it.scope });
      showResult(r); if (r.status === "ok") reload();
    } catch (e) {
      showAlert("请求失败：" + ((e && e.message) || e), "操作失败");
    }
    return;
  }
  if (act === "del"){
    if (!it.table){ showAlert("页面是旧版本，缺少表字段。请按 Ctrl+F5 强制刷新后重试。", "需要刷新"); return; }
    if (!btn.dataset.armed){
      btn.dataset.armed = "1"; btn.classList.add("armed"); btn.textContent = "再点一次";
      setTimeout(() => { btn.dataset.armed=""; btn.classList.remove("armed"); btn.textContent="删除"; }, 2600);
      return;
    }
    try {
      const r = await callApi("yh/delete", { table: it.table, name: it.content, scope: it.scope });
      showResult(r); if (r.status === "ok") reload();
    } catch (e) {
      showAlert("请求失败：" + ((e && e.message) || e), "操作失败");
    }
    return;
  }
  if (act === "edit"){
    editing = it;
    $("editName").value = it.content;
    $("editKeywords").value = it.keywords || "";
    $("editMeaning").value = it.meaning || "";
    updateCounter("editMeaning", "editCount");
    fillScope($("editScope"), it.scope || "");
    $("editMask").classList.add("on");
    $("editName").focus();
    return;
  }
});

let editing = null;
$("editCancel").onclick = () => $("editMask").classList.remove("on");
$("editSave").onclick = async () => {
  if (!editing) return;
  const name = $("editName").value.trim();
  const meaning = $("editMeaning").value.trim();
  if (!editing.table){ showAlert("页面是旧版本，缺少表字段。请按 Ctrl+F5 强制刷新后重试。", "需要刷新"); return; }
  if (!name || !meaning){
    showAlert("词条名和内容都不能为空", "没法保存");
    return;
  }
  const err = $("editErr");
  if (err) err.style.display = "none";
  let r;
  try {
    r = await Promise.race([
      api("yh/update", { table: editing.table, old_name: editing.content, old_scope: editing.scope,
        name, meaning, keywords: $("editKeywords").value.trim(),
        scope: $("editScope").value }),
      new Promise((_, reject) => setTimeout(() => reject(new Error("请求超时（10 秒）")), 10000)),
    ]);
  } catch (e) {
    const msg = "请求失败：" + ((e && e.message) || e);
    showAlert(msg, "没能保存");
    return;
  }
  if (r.status === "ok"){
    showAlert(r.message || "内容已更新", "已保存");
    $("editMask").classList.remove("on"); editing = null; reload();
    return;
  }
  err.textContent = r.message || "保存失败";
  err.style.display = "block";
  showAlert(r.message || "服务器未返回原因，请查看 AstrBot 日志", "没能保存");
};

/* ---------- 录入 ---------- */
function fillScopeSelect(){
  fillScope($("addScope"), "__global__");
}
$("addBtn").onclick = async () => {
  if (!state.tree) await loadTree();
  fillScopeSelect();
  $("addName").value = ""; $("addKeywords").value = "";
  $("addMeaning").value = "";
  updateCounter("addMeaning", "addCount");
  $("addMask").classList.add("on");
  $("addName").focus();
};
$("addCancel").onclick = () => $("addMask").classList.remove("on");
async function doAdd(){
  const name = $("addName").value.trim();
  const meaning = $("addMeaning").value.trim();
  const scope = $("addScope").value;
  let r;
  try {
    r = await callApi("yh/add", { content: name, meaning, scope,
      keywords: $("addKeywords").value.trim() });
  } catch (e) {
    showAlert("请求失败：" + ((e && e.message) || e), "录入失败");
    return;
  }
  showResult(r, "录入结果");
  if (r.status === "ok"){ $("addMask").classList.remove("on"); reload(); }
}

$("addSave").onclick = async () => {
  const name = $("addName").value.trim();
  const meaning = $("addMeaning").value.trim();
  const scope = $("addScope").value;
  if (!name || !meaning) return showAlert("词条名和内容都不能填", "没法录入");
  let pre;
  try {
    pre = await callApi("yh/lookup", { name, scope });
  } catch (e) {
    showAlert("请求失败：" + ((e && e.message) || e), "查重失败");
    return;
  }
  const items = (pre && pre.data && pre.data.items) || [];
  const manualDup = items.find(x => x.table === "manual" || x.table === "manual_pending");
  if (manualDup){
    showAlert(`「${name}」已存在于${manualDup.table === "manual" ? "手动" : "手动待审"}：`+
      `${(manualDup.meaning || "").slice(0, 40)}…\n未覆盖。要改内容请用「修改」。`, "已存在");
    return;
  }
  const autoDup = items.find(x => x.table === "auto" || x.table === "auto_pending");
  if (autoDup){
    showConfirm(`黑话库已有同名条目「${name}」：\n${(autoDup.meaning || "").slice(0, 60)}…\n\n`+
      `继续会新建一条手动条目，不会覆盖黑话库那条。`, "要新建吗？", doAdd);
    return;
  }
  doAdd();
};

/* ---------- 设置 ---------- */
let cfgFields = [], cfgValues = {};

function renderSettings(d){
  cfgFields = d.fields || [];
  cfgValues = d.values || {};
  const groups = [
    { title: "基础", keys: ["enabled", "auto_learn", "listen_private", "blacklist_groups"] },
    { title: "学习与注入", keys: ["learn_frequency", "learn_batch_size",
        "learn_batch_delay_ms", "learn_batch_timeout", "extract_max", "inject_max",
        "max_meaning_chars", "provider_id", "reject_words"] },
    { title: "梗百科", keys: ["wiki_enable", "wiki_sync_enable",
        "wiki_sync_interval_days", "wiki_sync_time"] },
  ];
  const byKey = Object.fromEntries(cfgFields.map(f => [f.key, f]));
  const used = new Set();
  let html = "";
  for (const g of groups){
    const fs = g.keys.map(k => byKey[k]).filter(Boolean);
    if (!fs.length) continue;
    fs.forEach(f => used.add(f.key));
    html += `<div class="set-group"><div class="set-title">${g.title}</div>`;
    html += fs.map(f => fieldHTML(f, cfgValues[f.key])).join("");
    html += `</div>`;
  }
  const rest = cfgFields.filter(f => !used.has(f.key));
  if (rest.length){
    html += `<div class="set-group"><div class="set-title">其他</div>`;
    html += rest.map(f => fieldHTML(f, cfgValues[f.key])).join("");
    html += `</div>`;
  }
  $("setBody").innerHTML = html;

  // 模型下拉
  const sel = $("setBody").querySelector('[data-key="provider_id"]');
  if (sel){
    const cur = cfgValues.provider_id || "";
    sel.innerHTML = `<option value="">跟随主模型</option>` +
      (d.providers || []).map(p => `<option value="${esc(p.id)}">${esc(p.id)}${p.model ? " · " + esc(p.model) : ""}</option>`).join("");
    sel.value = cur;
  }
  // 关闭梗百科时收起下面几项
  const wikiOn = $("setBody").querySelector('[data-key="wiki_enable"]');
  if (wikiOn){
    const sync = () => {
      $("setBody").querySelectorAll(".wiki-dep").forEach(el => {
        el.style.display = wikiOn.checked ? "" : "none";
      });
    };
    wikiOn.onchange = sync; sync();
  }
  const last = d.wiki_synced_at ? new Date(Number(d.wiki_synced_at) * 1000)
    .toLocaleString("zh-CN", {hour12: false}) : "从未";
  $("wikiMeta").textContent = `梗库 ${d.wiki_count ?? 0} 条 · 上次同步 ${last}`;
}

function fieldHTML(f, value){
  const dep = f.key.startsWith("wiki_") && f.key !== "wiki_enable" ? "wiki-dep" : "";
  if (f.type === "bool"){
    return `<label class="set-row ${dep}">
      <input type="checkbox" data-key="${f.key}" ${value ? "checked" : ""} />
      <span>${esc(f.label)}</span></label>`;
  }
  if (f.key === "provider_id"){
    return `<div class="field ${dep}"><label>${esc(f.label)}</label>
      <select data-key="provider_id"></select></div>`;
  }
  if (f.type === "int"){
    const min = f.min != null ? `min="${f.min}"` : "";
    const max = f.max != null ? `max="${f.max}"` : "";
    return `<div class="field ${dep}"><label>${esc(f.label)}</label>
      <input type="number" data-key="${f.key}" ${min} ${max} value="${value ?? f.default ?? ""}" /></div>`;
  }
  return `<div class="field ${dep}"><label>${esc(f.label)}</label>
    <input type="text" data-key="${f.key}" value="${esc(value ?? f.default ?? "")}" /></div>`;
}

$("settingsBtn").onclick = async () => {
  const r = await api("yh/config", {});
  if (r.status !== "ok"){ showAlert(r.message || "读取配置失败", "读取配置失败"); return; }
  renderSettings(r.data);
  $("setMask").classList.add("on");
};
$("setCancel").onclick = () => $("setMask").classList.remove("on");
$("setSave").onclick = async () => {
  const payload = {};
  $("setBody").querySelectorAll("[data-key]").forEach(el => {
    const key = el.dataset.key;
    const f = cfgFields.find(x => x.key === key);
    if (!f) return;
    payload[key] = f.type === "bool" ? el.checked
      : f.type === "int" ? Number(el.value)
      : el.value;
  });
  const r = await api("yh/config", payload);
  showAlert((r.message ? r.message + "。" : "") + "配置已写入后台；学习频率、模型等改动建议重载插件后生效。", "设置已保存");
  if (r.status === "ok"){
    $("setMask").classList.remove("on");
    reload();
  }
};

/* ---------- 批量审核 ---------- */
function syncBulk(){
  const bar = $("bulkBar");
  const isPending = state.bucket === "pending";
  bar.classList.toggle("show", isPending);
  if (!isPending) return;
  const n = state.selected.size;
  $("bulkCount").textContent = `已选 ${n} 条`;
  $("bulkApprove").disabled = n === 0;
  $("bulkDelete").disabled = n === 0;
  const picks = [...document.querySelectorAll("#list .pick")];
  $("bulkAll").checked = picks.length > 0 && picks.every(p => p.checked);
  $("bulkAll").indeterminate = n > 0 && !$("bulkAll").checked;
}

$("list").addEventListener("change", e => {
  const cb = e.target.closest(".pick");
  if (!cb) return;
  const id = cb.dataset.id;
  if (cb.checked) state.selected.add(id); else state.selected.delete(id);
  syncBulk();
});

$("bulkAll").onchange = () => {
  const picks = [...document.querySelectorAll("#list .pick")];
  const on = $("bulkAll").checked;
  picks.forEach(p => { p.checked = on; });
  state.selected.clear();
  if (on) picks.forEach(p => state.selected.add(p.dataset.id));
  syncBulk();
};

async function bulkAction(action){
  const ids = [...state.selected];
  const items = ids.map(id => state.cache.get(String(id))).filter(Boolean)
    .map(it => ({ table: it.table, name: it.content, scope: it.scope }));
  if (!ids.length) return;
  if (action === "delete" && !confirm(`确定删除选中的 ${ids.length} 条待审？`)) return;
  const r = await api("yh/bulk", { action, items });
  if (r.status !== "ok"){
    showResult(r, "批量完成");
    return;
  }
  showAlert(r.message || "操作完成", "完成");
  reload();
}

$("bulkApprove").onclick = () => bulkAction("approve");
$("bulkDelete").onclick = () => bulkAction("delete");

/* ---------- 排序 ---------- */
$("sortSelect").onchange = () => {
  state.sort = $("sortSelect").value === "count" ? "count" : "recent";
  state.page = 1;
  loadList();
};

/* ---------- 搜索与快捷键 ---------- */
let searchTimer;
$("searchInput").oninput = () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    state.search = $("searchInput").value.trim();
    state.page = 1;
    loadList();
  }, 300);
};
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== $("searchInput")){
    e.preventDefault(); $("searchInput").focus();
  }
  if (e.key === "Escape"){
    document.querySelectorAll(".mask.on").forEach(m => m.classList.remove("on"));
  }
});

let meaningLimit = 200;
function updateCounter(inputId, countId){
  const el = $(inputId), c = $(countId);
  if (!el || !c) return;
  const n = (el.value || "").length;
  c.textContent = `${n}/${meaningLimit}`;
  c.classList.toggle("over", n > meaningLimit);
}
async function loadMeaningLimit(){
  try {
    const r = await api("yh/config", {});
    const v = r && r.data && r.data.values;
    if (v && Number(v.max_meaning_chars) > 0) meaningLimit = Number(v.max_meaning_chars);
  } catch (e) {}
  updateCounter("editMeaning", "editCount");
  updateCounter("addMeaning", "addCount");
}
$("editMeaning").addEventListener("input", () => updateCounter("editMeaning", "editCount"));
$("addMeaning").addEventListener("input", () => updateCounter("addMeaning", "addCount"));
loadMeaningLimit();

reload();
</script>
</body>
